[package]
name = "tauri-plugin-immporter"
version = "0.5.0"
description = "Fast, verified SD card photo importer, as a Tauri plugin"
edition = "2021"
links = "tauri-plugin-immporter"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rawler = "0.8.0"
kamadak-exif = "0.6.1"
blake3 = "1.8.7"
rusqlite = { version = "0.40.2", features = ["bundled"] }
walkdir = "2.5.0"
rayon = "1.12.0"
sysinfo = "0.39.6"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12.5"
libc = "0.2.190"
filetime = "0.2.29"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha1 = "0.11.0"
base64 = "0.23.1"
reqwest = { version = "0.13", features = ["blocking", "json"] }

[dev-dependencies]
mockito = "1.7.2"
parking_lot = "0.12.5"
tempfile = "3.27.0"
walkdir = "2.5.0"
